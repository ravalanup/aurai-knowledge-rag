{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aurai-knowledge
  labels:
    {{- include "aurai-knowledge.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "aurai-knowledge.selector" . | nindent 6 }}
{{- end }}
