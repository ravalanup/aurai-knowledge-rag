{{- if .Values.networkPolicy.enabled }}
# kind's default network plugin does not enforce NetworkPolicy; EKS needs policy support enabled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-ingress
  labels:
    {{- include "aurai-knowledge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aurai-knowledge.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: 8000
{{- end }}
