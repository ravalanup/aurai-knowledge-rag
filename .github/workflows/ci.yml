name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Validate the shipped corpus
        run: aurai-knowledge validate-corpus --source corpus
      - name: Retrieval evaluation and leakage gate (offline)
        run: aurai-knowledge eval
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aurai-knowledge:ci .
      - name: The image starts and shows its CLI
        run: docker run --rm aurai-knowledge:ci --version