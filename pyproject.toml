[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurai-knowledge-rag"
version = "0.1.0"
description = "Aurai knowledge service: entitlement-aware retrieval over approved document collections"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "qdrant-client>=1.12",
  "httpx>=0.27",
  "pydantic>=2.5",
  "pyjwt[crypto]>=2.8",
  "pypdf>=4.0",
  "pyyaml>=6.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "jsonschema>=4.21",
  "boto3>=1.34",
  "reportlab>=4.0",
]

[project.scripts]
aurai-knowledge = "aurai_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
